name: Construire APK Le Guide de l'ordinateur

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "style.css"
      - "manifest.json"
      - "images/**"
      - "audio/**"
      - ".github/workflows/build-apk.yml"

jobs:
  construire-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer les composants Android
        shell: bash
        run: |
          set -e
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Verifier les fichiers
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f app.js
          test -f style.css
          test -f manifest.json
          test -f images/icon.png
          test -f images/splash.png
          test -d audio
          echo "Verification des fichiers reussie."

      - name: Preparer le projet Node
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            cat > package.json <<'EOF'
          {
            "name": "le-guide-de-l-ordinateur",
            "version": "1.0.0",
            "private": true
          }
          EOF
          fi

      - name: Installer Capacitor
        shell: bash
        run: |
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/assets@3

      - name: Preparer les fichiers Web
        shell: bash
        run: |
          set -e
          rm -rf www
          mkdir -p www
          cp index.html app.js style.css manifest.json www/
          cp -r images audio www/

      - name: Preparer icone et splash screen
        shell: bash
        run: |
          set -e
          mkdir -p assets
          cp images/icon.png assets/icon.png
          cp images/splash.png assets/splash.png
          echo "Icone et splash screen copies."

      - name: Configurer Capacitor
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.israelzongwe.guideordinateur",
            "appName": "Le Guide de l'ordinateur",
            "webDir": "www"
          }
          EOF

      - name: Ajouter Android si necessaire
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generer les images Android
        shell: bash
        run: |
          npx @capacitor/assets generate --android

      - name: Synchroniser Android
        shell: bash
        run: |
          npx cap sync android

      - name: Construire APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verifier APK
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Le_Guide_de_l_ordinateur_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
